# 将 Roboflow Bicycle.v2i 增量追加到 detect_w1_fire
#
# 源类 Bicycle 已 remap 为 bicycle。prefix 用 bike2，避免与 coco/ebike 已有文件碰撞。
# 合并时合成一池后按 7:2:1 划分 train/val/test。
#
# 用法：
#   python datasets/scripts/remap_yolo_set.py \
#     --src .../Bicycle.v2i.yolo26 \
#     --out .../bicycle_v2i_yolo \
#     --map config/class_maps/bicycle_roboflow.yaml
#   python datasets/scripts/merge_yolo_sets.py --mode append \
#     --config config/merge_w2_bicycle2.yaml \
#     --out .../detect_w1_fire

version: 1

names:
  - person
  - bicycle
  - car
  - truck
  - smoke
  - flame
  - ebike
  - litter_bottle
  - litter_plastic_bag
  - litter_paper
  - litter_cardboard
  - fishing_rod
  - cigarette_or_smoke
  - pet

sets:
  - root: /media/sribd/C02E01372E01284C/patrol_perception/datasets/downloads/bicycle_v2i_yolo
    prefix: bike2
    keep: [bicycle]
    split_ratios: [0.7, 0.2, 0.1]
    split_seed: 0
