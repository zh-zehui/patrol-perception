<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">标注审核状态流转</title><desc id="desc">候选复制为草稿，人工标记可提交后写入正式标签，旧标签保留历史</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607b9f"/></marker></defs>
<rect width="1440" height="480" rx="24" fill="#0b1425"/>
<g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="52" y="53" font-size="17" fill="#54d6bd" font-weight="700">ANNOTATION REVIEW / STATE FLOW</text>
<text x="52" y="105" font-size="36" fill="#e8f0fb" font-weight="700">候选、草稿与正式标签分层</text>
<rect x="52" y="158" width="298" height="126" rx="16" fill="#142238" stroke="#263a55"/>
<rect x="72" y="180" width="5" height="22" rx="2" fill="#73a9ff"/>
<text x="88" y="198" font-size="25" fill="#e8f0fb" font-weight="700">模型候选</text>
<text x="76" y="235" font-size="18" fill="#9db0cb" font-weight="400">不修改正式标签</text>
<text x="76" y="264" font-size="16" fill="#73a9ff" font-weight="400">candidates/</text>
<rect x="398" y="158" width="298" height="126" rx="16" fill="#142238" stroke="#263a55"/>
<rect x="418" y="180" width="5" height="22" rx="2" fill="#73a9ff"/>
<text x="434" y="198" font-size="25" fill="#e8f0fb" font-weight="700">人工编辑草稿</text>
<text x="422" y="235" font-size="18" fill="#9db0cb" font-weight="400">复制候选或正式基线后编辑</text>
<text x="422" y="264" font-size="16" fill="#73a9ff" font-weight="400">drafts/</text>
<rect x="744" y="158" width="298" height="126" rx="16" fill="#142238" stroke="#263a55"/>
<rect x="764" y="180" width="5" height="22" rx="2" fill="#f5c56e"/>
<text x="780" y="198" font-size="25" fill="#e8f0fb" font-weight="700">标记可提交</text>
<text x="768" y="235" font-size="18" fill="#9db0cb" font-weight="400">人工确认后进入批量提交范围</text>
<text x="768" y="264" font-size="16" fill="#f5c56e" font-weight="400">draft_ready</text>
<rect x="1090" y="158" width="298" height="126" rx="16" fill="#142238" stroke="#263a55"/>
<rect x="1110" y="180" width="5" height="22" rx="2" fill="#54d6bd"/>
<text x="1126" y="198" font-size="25" fill="#e8f0fb" font-weight="700">提交正式标签</text>
<text x="1114" y="235" font-size="18" fill="#9db0cb" font-weight="400">更新 YOLO TXT 与审核状态</text>
<text x="1114" y="264" font-size="16" fill="#54d6bd" font-weight="400">labels/ · reviewed</text>
<path d="M355 221 L392 221" fill="none" stroke="#607b9f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M701 221 L738 221" fill="none" stroke="#607b9f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1047 221 L1084 221" fill="none" stroke="#607b9f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="398" y="326" width="298" height="78" rx="16" fill="#142238" stroke="#263a55"/>
<text x="422" y="358" font-size="20" fill="#f5c56e" font-weight="400">需复核 → 返回人工编辑</text>
<text x="422" y="386" font-size="17" fill="#9db0cb" font-weight="400">needs_review</text>
<path d="M547 325 L547 290" fill="none" stroke="#607b9f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="744" y="326" width="644" height="78" rx="16" fill="#142238" stroke="#263a55"/>
<text x="768" y="358" font-size="21" fill="#54d6bd" font-weight="400">提交前备份旧标签；提交成功追加操作记录</text>
<text x="768" y="387" font-size="18" fill="#9db0cb" font-weight="400">history/ + commit_log.jsonl</text>
<path d="M1239 289 L1239 320" fill="none" stroke="#607b9f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="52" y="450" font-size="19" fill="#9db0cb" font-weight="400">模型批量标注只生成候选；批量提交只处理人工明确标记为 draft_ready 的图片。</text>
</g>
</svg>
