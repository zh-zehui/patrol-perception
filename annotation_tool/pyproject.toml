[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d1-dataset-annotation"
version = "0.2.1"
description = "Local browser-based YOLO dataset review and annotation tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
d1-annotate = "d1_annotation.cli:main"
d1-annotate-portal = "d1_annotation.portal_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/d1_annotation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
