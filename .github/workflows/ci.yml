name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CPU tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            annotation_tool/pyproject.toml
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check public files and history
        run: python scripts/check_publication.py --history
      - name: Run existing test suites
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
