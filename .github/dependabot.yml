version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      development:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /annotation_tool
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
